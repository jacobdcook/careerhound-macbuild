name: Windows and Linux build

# Builds Windows and Linux from the private CareerHound repo (read-only deploy key),
# launches each app and walks every page, then attaches the zips to a release here.
# Only a person with write access can start it; there is no push or PR trigger.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit in jacobdcook/careerhound, e.g. v0.2.13-b"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out CareerHound source
        uses: actions/checkout@v4
        with:
          repository: jacobdcook/careerhound
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements*.txt

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt -r requirements-build.txt

      - name: Check packaging inputs
        shell: bash
        run: python tools/check_packaging.py

      - name: Build Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build_win.ps1 -Qt

      - name: Build Qt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python build_release.py --qt

      - name: Require dist zip
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          python -c "
          import glob, os, sys, zipfile
          artifact = os.environ.get('ARTIFACT', '')
          zips = sorted(glob.glob(f'dist/CareerHound-v*-{artifact}.zip'))
          if not zips:
              print(f'ERROR: no CareerHound-v*-{artifact}.zip')
              sys.exit(1)
          need = ('license.py', 'license_bind.py', 'license_client.py')
          for z in zips:
              print('Checking', z)
              with zipfile.ZipFile(z) as zf:
                  names = set(zf.namelist())
                  missing = [n for n in need if not any(p == n or p.endswith('/' + n) for p in names)]
                  if missing:
                      print('MISSING in', z, ':', missing)
                      sys.exit(1)
                  qml_ok = any(n.lower().endswith('main.qml') for n in names)
                  if not qml_ok:
                      print('MISSING QML Main.qml in', z)
                      sys.exit(1)
                  if not any('pyside6' in n.lower() for n in names):
                      print('MISSING PySide6 in', z)
                      sys.exit(1)
                  pw = [n for n in names if 'playwright' in n.lower()]
                  if pw:
                      print('ERROR: playwright bundled in', z, ':', pw[:20])
                      sys.exit(1)
                  print('OK Qt zip', z)
          "

      - name: Launch the built app and open every page
        timeout-minutes: 15
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/smoke"
          rm -rf "$work"; mkdir -p "$work"
          zipf=$(ls dist/CareerHound-v*-"$ARTIFACT".zip | head -1)
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -x -k "$zipf" "$work"
          else
            python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zipf" "$work"
          fi
          case "$RUNNER_OS" in
            Windows) bin=$(find "$work" -maxdepth 3 -name CareerHound.exe | head -1) ;;
            macOS)   bin="$work/CareerHound.app/Contents/MacOS/CareerHound"
                     # A hosted runner has no unlocked login keychain, so the app's first
                     # keychain write waits forever on an unlock prompt. Give it one.
                     export HOME="$RUNNER_TEMP/smokehome"; mkdir -p "$HOME/Library/Keychains"
                     security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
                     security set-keychain-settings "$RUNNER_TEMP/ci.keychain-db"
                     security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
                     security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db"
                     security default-keychain -d user -s "$RUNNER_TEMP/ci.keychain-db"
                     [ -x "$bin" ] || { echo "ERROR: zip does not contain CareerHound.app"; ls -la "$work"; exit 1; }
                     codesign --verify --verbose=1 "$work/CareerHound.app/Contents/Resources/app/CareerHound" || echo "WARN: app binary signature did not verify" ;;
            *)       bin=$(find "$work" -maxdepth 3 -type f -name CareerHound | head -1); chmod +x "$bin"
                     sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null ;;
          esac
          echo "Launching $bin"
          [ "$RUNNER_OS" = "macOS" ] || { export HOME="$RUNNER_TEMP/smokehome"; mkdir -p "$HOME"; }
          code=0
          CH_ASSUME_KEYCHAIN=0 "$bin" --package-smoke --headless > "$work/smoke.log" 2>&1 &
          pid=$!
          for i in $(seq 1 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "ERROR: app still running after 10 minutes; killing it"
            if [ "$RUNNER_OS" = "macOS" ]; then sample "$pid" 5 -file "$work/sample.txt" >/dev/null 2>&1 && head -80 "$work/sample.txt"; fi
            pkill -TERM -P "$pid" 2>/dev/null; kill -TERM "$pid" 2>/dev/null; sleep 3; kill -KILL "$pid" 2>/dev/null
            code=124
          else
            wait "$pid" || code=$?
          fi
          cat "$work/smoke.log" || true
          find "$work" -path '*reports/pyside6_migration*' -name '*.json' -maxdepth 8 2>/dev/null | head -3 | xargs -r -I{} sh -c 'echo "== {}"; head -c 4000 "{}"; echo'
          if [ "$code" -ne 0 ]; then echo "ERROR: packaged app smoke failed on $RUNNER_OS (exit $code)"; exit 1; fi
          echo "OK: packaged app launched and walked every page on $RUNNER_OS"

      - name: Attach zip to a release here
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          zipf=$(ls dist/CareerHound-v*-"$ARTIFACT".zip | head -1)
          gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$REF" --repo "$GITHUB_REPOSITORY" --title "CareerHound build $REF" --notes "Builds of CareerHound $REF. Download from usecareerhound.com." || true
          gh release upload "$REF" "$zipf" --repo "$GITHUB_REPOSITORY" --clobber
