name: macOS build

# Builds the macOS app from the private CareerHound repo (read-only deploy key),
# launches it and walks every page, then attaches the zip to a release here.
# Only a person with write access can start it; there is no push or PR trigger.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit in jacobdcook/careerhound, e.g. v0.2.12-b"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out CareerHound source
        uses: actions/checkout@v4
        with:
          repository: jacobdcook/careerhound
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements*.txt

      - name: Install deps
        working-directory: src
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt -r requirements-build.txt

      - name: Build
        working-directory: src
        run: bash build_mac.sh > "$RUNNER_TEMP/build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }

      - name: Launch the built app and open every page
        timeout-minutes: 15
        shell: bash
        run: |
          set -uo pipefail
          zipf=$(ls src/dist/CareerHound-v*-macos.zip | head -1)
          work="$RUNNER_TEMP/smoke"; rm -rf "$work"; mkdir -p "$work"
          ditto -x -k "$zipf" "$work"
          bin="$work/CareerHound.app/Contents/MacOS/CareerHound"
          [ -x "$bin" ] || { echo "ERROR: zip does not contain CareerHound.app"; exit 1; }
          export HOME="$RUNNER_TEMP/smokehome"; mkdir -p "$HOME/Library/Keychains"
          security create-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/ci.keychain-db"
          code=0
          CH_ASSUME_KEYCHAIN=0 "$bin" --package-smoke --headless > "$work/smoke.log" 2>&1 &
          pid=$!
          for i in $(seq 1 600); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "ERROR: app still running after 10 minutes"
            sample "$pid" 5 -file "$work/sample.txt" >/dev/null 2>&1 && grep -E "Security|Keychain|PySide|Qt" "$work/sample.txt" | head -40
            kill -KILL "$pid" 2>/dev/null; code=124
          else
            wait "$pid" || code=$?
          fi
          grep -E "package smoke overall|CRITICAL|Traceback|Error" "$work/smoke.log" | head -20
          [ "$code" -eq 0 ] || { echo "ERROR: packaged app smoke failed (exit $code)"; exit 1; }
          echo "OK: macOS app launched and walked every page"

      - name: Attach zip to a release here
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          zipf=$(ls src/dist/CareerHound-v*-macos.zip | head -1)
          gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$REF" --repo "$GITHUB_REPOSITORY" --title "macOS build $REF" --notes "macOS build of CareerHound $REF. Download from usecareerhound.com."
          gh release upload "$REF" "$zipf" --repo "$GITHUB_REPOSITORY" --clobber
